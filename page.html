
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Attrape la cible !</title>
  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #38bdf8;
      margin-top: 30px;
    }

    #jeu {
      position: relative;
      width: 90%;
      max-width: 600px;
      height: 350px;
      margin: 20px auto;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 15px;
      overflow: hidden;
    }

    #cible {
      position: absolute;
      width: 55px;
      height: 55px;
      background: #f43f5e;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 20px #f43f5e;
    }

    button {
      padding: 12px 25px;
      background: #38bdf8;
      color: #101827;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>

  <h1>🎯 Attrape la cible !</h1>
  <h2>Score : <span id="score">0</span></h2>
  <h3>Temps : <span id="temps">30</span>s</h3>

  <div id="jeu">
    <div id="cible"></div>
  </div>

  <button onclick="demarrer()">Jouer !</button>

  <script>
    let score = 0;
    let temps = 30;
    let intervalle;
    let actif = false;

    const cible = document.getElementById("cible");
    const jeu = document.getElementById("jeu");

    function bougerCible() {
      const x = Math.random() *
        (jeu.clientWidth - cible.offsetWidth);
      const y = Math.random() *
        (jeu.clientHeight - cible.offsetHeight);

      cible.style.left = x + "px";
      cible.style.top = y + "px";
    }

    cible.addEventListener("click", function() {
      if (!actif) return;
      score++;
      document.getElementById("score").textContent = score;
      bougerCible();
    });

    function demarrer() {
      clearInterval(intervalle);
      score = 0;
      temps = 30;
      actif = true;

      document.getElementById("score").textContent = score;
      document.getElementById("temps").textContent = temps;

      cible.style.display = "block";
      bougerCible();

      intervalle = setInterval(function() {
        temps--;
        document.getElementById("temps").textContent = temps;

        if (temps <= 0) {
          clearInterval(intervalle);
          actif = false;
          cible.style.display = "none";
          alert("Partie terminée ! Score : " + score);
        }
      }, 1000);
    }
  </script>

</body>
</html>
